[project]
name = "airanticollision"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
    "av==18.1.0",
    "numpy>=2.5.2",
    "onnx>=1.23.2",
    "onnxruntime-gpu>=1.31.0",
    "tensorrt>=11.1.0.106",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
